          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>

    <main id="main" tabindex="-1">
      <header class="page-header">
        <h1>联系人转 VCF</h1>
        <p class="intro">批量解析“姓名 + 电话”，一键导出手机通用的标准 VCF 3.0 通讯录文件。</p>
      </header>

      <!-- 一体化 Studio 工作台 -->
      <div class="workbench">
        <!-- 顶部功能配置条 -->
        <div class="wb-toolbar">
          <div class="wb-toolbar-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>姓名规则</span>
          </div>
          <div class="wb-toolbar-fields">
            <label class="wb-field">
              <span>前缀</span>
              <input id="prefix" placeholder="例如：客户" autocomplete="off">
            </label>
            <label class="wb-field">
              <span>后缀</span>
              <input id="suffix" placeholder="选填" autocomplete="off">
            </label>
            <label class="wb-check">
              <input id="phone-suffix" type="checkbox">
              <span>附加号码后四位</span>
            </label>
          </div>
        </div>

        <!-- 左右对称工作区 -->
        <div class="wb-body">
          <!-- 左侧输入栏 -->
          <div class="wb-pane wb-left">
            <div class="wb-pane-head">
              <span class="wb-badge">1</span>
              <label for="source" class="wb-pane-title" id="source-heading">输入联系人名单</label>
              <span class="wb-pane-hint">每行一位：姓名 + 号码</span>
            </div>
            <div class="wb-editor-wrap">
              <textarea id="source" spellcheck="false" placeholder="示例联系人甲 +33 6 00 00 00 01&#10;示例联系人乙 +86 138 0000 0000"></textarea>
            </div>
          </div>

          <!-- 右侧预览栏 -->
          <div class="wb-pane wb-right">
            <div class="wb-pane-head">
              <span class="wb-badge">2</span>
              <span class="wb-pane-title" id="preview-heading">生成结果预览</span>
              <span class="caption" id="contact-count">0 位联系人</span>
            </div>
            <div class="wb-preview-wrap">
              <div class="preview-head">
                <span>保存的姓名</span>
                <span>电话号码</span>
              </div>
              <div id="contacts" class="wb-contacts-list">
                <div class="empty">暂无联系人 · 请输入后点击“解析预览”</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 状态栏 -->
        <p id="status" class="status wb-status" role="status" aria-live="polite"></p>

        <!-- 底部贯穿式操作底栏 -->
        <div class="wb-footer">
          <div class="wb-footer-left">
            <button id="sample" class="button ghost" type="button">填入示例</button>
            <button id="clear" class="button ghost" type="button">清空输入</button>
            <span class="hint-inline">导出后在手机通讯录选择“从文件导入”</span>
          </div>
          <div class="wb-footer-right">
            <button id="parse" class="button" type="button">解析预览 <span aria-hidden="true">→</span></button>
            <button id="download" class="button primary" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg>
              下载 VCF 文件
            </button>
          </div>
        </div>
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-links"><a href="index.html#privacy">隐私说明</a><a href="https://github.com/Alex97FR/alex97fr.github.io" target="_blank" rel="noopener noreferrer">开源代码 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H5v14h14v-3M13 5h6v6M19 5l-9 9"/></svg></a></div>
    </footer>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    let contacts = [];

    const now = new Date();
    $('prefix').value = `${now.getMonth() + 1}/${now.getDate()}`;

    function parseContacts(text) {
      const found = [], rejected = [];
      text.split(/\r\n|\r|\n/).forEach((raw, index) => {
        const line = raw.trim();
        if (!line) return;
        const match = line.match(/(?:^|[\s,;:，；：])(\+?[\d(][\d\s().-]{5,}\d)\s*$/);
        const name = match && line.slice(0, match.index).replace(/[,;:，；：\s-]+$/, "").trim();
        const phone = match && match[1].replace(/(?!^)\+|[^\d+]/g, "");
        if (name && phone && phone.replace(/\D/g, "").length >= 7 && phone.replace(/\D/g, "").length <= 15) found.push({ name, phone });
        else rejected.push(index + 1);
      });
      return { found, rejected };
    }

    function phoneLast4(phone) {
      return phone.replace(/\D/g, '').slice(-4);
    }

    function fullName(name, phone) {
      const last4 = $('phone-suffix').checked ? phoneLast4(phone) : '';
      return [$('prefix').value.trim(), name, $('suffix').value.trim(), last4].filter(Boolean).join(' ');
    }

    function render() {
      const box = $('contacts');
      $('contact-count').textContent = `${contacts.length} 位联系人`;
      box.replaceChildren();
      if (!contacts.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '暂无联系人';
        box.append(empty);
        return;
      }
      const fragment = document.createDocumentFragment();
      contacts.forEach(contact => {
        const row = document.createElement('div');
        row.className = 'contact';
        const name = document.createElement('span');
        const phone = document.createElement('span');
        name.textContent = fullName(contact.name, contact.phone);
        phone.textContent = contact.phone;
        row.append(name, phone);
        fragment.append(row);
      });
      box.append(fragment);
    }

    function escapeVcf(value) {
      return value.replace(/\\/g, '\\\\').replace(/\r\n|\r|\n/g, '\\n').replace(/;/g, '\\;').replace(/,/g, '\\,');
    }

    function foldVcfLine(line) {
      const encoder = new TextEncoder();
      let folded = '', length = 0;
      for (const character of line) {
        const size = encoder.encode(character).length;
        if (length + size > 75) { folded += '\r\n '; length = 1; }
        folded += character;
        length += size;
      }
      return folded;
    }

    function makeVcf() {
      return contacts.map(contact => {
        const name = escapeVcf(fullName(contact.name, contact.phone));
        return ['BEGIN:VCARD', 'VERSION:3.0', `N:${name};;;;`, `FN:${name}`, `TEL;TYPE=CELL,VOICE:${contact.phone}`, 'END:VCARD'].map(foldVcfLine).join('\r\n');
      }).join('\r\n') + '\r\n';
    }

    $('parse').addEventListener('click', () => {
      const result = parseContacts($('source').value);
      contacts = result.found;
      render();
      $('download').disabled = !contacts.length;
      $('status').className = 'status' + (contacts.length ? '' : ' error');
      $('status').textContent = contacts.length
        ? `已解析 ${contacts.length} 位联系人${result.rejected.length ? `，跳过第 ${result.rejected.join('、')} 行` : ''}`
        : '未识别到联系人，请确认每行末尾是 7–15 位电话号码，并用空格、Tab 或逗号分隔姓名';
    });

    $('source').addEventListener('input', () => {
      contacts = [];
      render();
      $('download').disabled = true;
      $('status').className = 'status';
      $('status').textContent = '输入已更新，请重新解析。';
    });

    $('clear').addEventListener('click', () => {
      $('source').value = '';
      contacts = [];
      render();
      $('download').disabled = true;
      $('status').className = 'status';
      $('status').textContent = '';
      $('source').focus();
    });

    function showToast(message) {
      if (typeof document === 'undefined' || !document.body || typeof document.body.appendChild !== 'function') return;
      let box = document.getElementById('toast-container');
      if (!box) {
        box = document.createElement('div');
        box.id = 'toast-container';
        box.className = 'toast-container';
        box.setAttribute('aria-live', 'polite');
        document.body.appendChild(box);
      }
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      box.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove && toast.remove(), 250);
      }, 2200);
    }

    $('download').addEventListener('click', () => {
      if (!contacts.length) return;
      const count = contacts.length;
      const url = URL.createObjectURL(new Blob([makeVcf()], { type: 'text/vcard;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = `contacts-${new Date().toISOString().slice(0, 10)}.vcf`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast(`已生成并下载 ${count} 位联系人 VCF`);
    });

    ['prefix', 'suffix', 'phone-suffix'].forEach(id => $(id).addEventListener('input', render));

    $('sample').addEventListener('click', () => {
      $('source').value = 'Alexandre +33 6 12 34 56 78\n王总 13800000000\nSophie Martin +33 6 98 76 54 32';
      $('phone-suffix').checked = true;
      const result = parseContacts($('source').value);
      contacts = result.found;
      render();
      $('download').disabled = false;
      $('status').className = 'status';
      $('status').textContent = '已填入并解析 3 位示例联系人。';
      showToast('已填入示例数据');
    });

    const themeBtn = $('theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
          (!document.documentElement.getAttribute('data-theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch {}
        showToast(next === 'dark' ? '已切换至深色模式 🌙' : '已切换至浅色模式 ☀️');
      });
    }

    console.assert(parseContacts('示例联系人甲 00000000000\n示例联系人乙 +00 000 000 000').found.length === 2, '联系人解析自检失败');
    console.assert(phoneLast4('+00 000 123 456') === '3456', '号码后四位自检失败');
  </script>
</body>
