<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11182b">
  <title>联系人转 VCF</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1222;
      --panel: #172239;
      --field: #0c1528;
      --line: #2a3a58;
      --text: #f5f7fb;
      --muted: #91a0ba;
      --blue: #3b82f6;
      --blue-hover: #2563eb;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    aside { padding: 24px 18px; background: #121d34; border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 28px; font-size: 22px; font-weight: 800; }
    .logo { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: var(--blue); }
    .nav-title { margin: 14px 10px 8px; color: #71809b; font-size: 12px; letter-spacing: .12em; }
    .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); text-align: left; text-decoration: none; }
    .nav-item.active { background: var(--blue); color: white; }
    .nav-icon { width: 24px; text-align: center; font-size: 18px; }

    main { width: min(1180px, 100%); margin: 0 auto; padding: 42px 36px 70px; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 38px); }
    .subtitle { margin: 10px 0 28px; color: var(--muted); font-size: 17px; }
    .card { margin-top: 18px; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: 0 18px 50px #05091444; }
    .options { display: flex; align-items: end; gap: 18px; }
    label { display: grid; gap: 8px; color: var(--muted); }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 11px; outline: none; background: var(--field); color: var(--text); }
    input, select { height: 48px; padding: 0 14px; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #3b82f622; }
    .check { display: flex; align-items: center; gap: 9px; height: 48px; white-space: nowrap; }
    .check input { width: 18px; height: 18px; padding: 0; accent-color: var(--blue); }
    .hint { align-self: center; margin-top: 24px; color: #6f7d97; }
    textarea { min-height: 260px; padding: 18px; resize: vertical; line-height: 1.65; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
    .button { min-height: 48px; padding: 0 20px; border: 1px solid var(--line); border-radius: 11px; background: var(--field); color: var(--text); font-weight: 700; }
    .button.primary { border-color: var(--blue); background: var(--blue); }
    .button.primary:hover { background: var(--blue-hover); }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .status { min-height: 24px; margin: 14px 2px 0; color: var(--muted); }
    .status.error { color: #fb7185; }

    .preview { margin-top: 22px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; }
    .preview-head, .contact { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 14px 18px; }
    .preview-head { color: var(--muted); background: #0b1426; }
    .contact { border-top: 1px solid var(--line); }
    .contact span { min-width: 0; overflow-wrap: anywhere; }
    .empty { padding: 26px 18px; border-top: 1px solid var(--line); color: var(--muted); text-align: center; }

    @media (max-width: 760px) {
      .layout { display: block; }
      aside { padding: 14px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { padding: 0; }
      aside .nav-title, aside .nav-item:not(.active) { display: none; }
      .nav-item.active { margin-top: 12px; }
      main { padding: 28px 16px 50px; }
      .card { padding: 16px; }
      .options { display: grid; grid-template-columns: 1fr 1fr; }
      .check { grid-column: 1 / -1; }
      .hint { grid-column: 1 / -1; margin: 0; }
      textarea { min-height: 220px; }
      .preview-head, .contact { grid-template-columns: 1.2fr 1fr; padding-inline: 12px; }
      .actions .button { flex: 1 1 130px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand"><span class="logo">工</span> 工具箱</div>
      <div class="nav-title">工具</div>
      <button class="nav-item active" type="button"><span class="nav-icon">♟</span> 联系人转 VCF</button>
      <a class="nav-item" href="whatsapp.html"><span class="nav-icon">◌</span> 生成 WhatsApp 链接</a>
    </aside>

    <main>
      <h1>联系方式解析 · 生成 VCF</h1>
      <p class="subtitle">粘贴姓名和电话号码，一键生成 Android 可导入的通讯录文件</p>

      <section class="card options" aria-label="姓名设置">
        <label>姓名前缀
          <input id="prefix" placeholder="例如：7/13" autocomplete="off">
        </label>
        <label>姓名后缀
          <input id="suffix" placeholder="可不填" autocomplete="off">
        </label>
        <label class="check"><input id="phone-suffix" type="checkbox">附加号码后四位</label>
        <span class="hint">最终姓名：前缀 + 姓名 + 自定义后缀 + 可选号码后四位</span>
      </section>

      <section class="card">
        <label for="source">联系人文本</label>
        <textarea id="source" spellcheck="false" placeholder="每行一位联系人，例如：&#10;示例联系人甲 00000000000&#10;示例联系人乙 +00 000 000 000"></textarea>
        <div class="actions">
          <button id="parse" class="button primary" type="button">解析联系人</button>
          <button id="clear" class="button" type="button">清空</button>
          <button id="download" class="button primary" type="button" disabled>保存 VCF 文件</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">输入联系人后点击“解析联系人”</p>

        <div class="preview" aria-label="联系人预览">
          <div class="preview-head"><span>姓名</span><span>号码</span></div>
          <div id="contacts"><div class="empty">尚未解析联系人</div></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let contacts = [];

    function parseContacts(text) {
      const found = [], rejected = [];
      text.split(/\r?\n/).forEach((raw, index) => {
        const line = raw.trim();
        if (!line) return;
        const match = line.match(/(\+?[\d][\d\s().-]{5,}\d)\s*$/);
        const name = match && line.slice(0, match.index).replace(/[,;:\s-]+$/, "").trim();
        const phone = match && match[1].replace(/(?!^)\+|[^\d+]/g, "");
        if (name && phone && phone.replace(/\D/g, "").length >= 7) found.push({ name, phone });
        else rejected.push(index + 1);
      });
      return { found, rejected };
    }

    function phoneLast4(phone) {
      return phone.replace(/\D/g, '').slice(-4);
    }

    function fullName(name, phone) {
      const last4 = $('phone-suffix').checked ? phoneLast4(phone) : '';
      return [$('prefix').value.trim(), name, $('suffix').value.trim(), last4].filter(Boolean).join(' ');
    }

    function render() {
      const box = $('contacts');
      box.replaceChildren();
      if (!contacts.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '没有可保存的联系人';
        box.append(empty);
        return;
      }
      contacts.forEach(contact => {
        const row = document.createElement('div');
        row.className = 'contact';
        const name = document.createElement('span');
        const phone = document.createElement('span');
        name.textContent = fullName(contact.name, contact.phone);
        phone.textContent = contact.phone;
        row.append(name, phone);
        box.append(row);
      });
    }

    function escapeVcf(value) {
      return value.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/;/g, '\\;').replace(/,/g, '\\,');
    }

    function makeVcf() {
      return contacts.map(contact => {
        const name = escapeVcf(fullName(contact.name, contact.phone));
        return ['BEGIN:VCARD', 'VERSION:3.0', `N:;${name};;;`, `FN:${name}`, `TEL;TYPE=CELL:${contact.phone}`, 'END:VCARD'].join('\r\n');
      }).join('\r\n') + '\r\n';
    }

    $('parse').addEventListener('click', () => {
      const result = parseContacts($('source').value);
      contacts = result.found;
      render();
      $('download').disabled = !contacts.length;
      $('status').className = 'status' + (contacts.length ? '' : ' error');
      $('status').textContent = contacts.length
        ? `已解析 ${contacts.length} 位联系人${result.rejected.length ? `，跳过第 ${result.rejected.join('、')} 行` : ''}`
        : '未识别到联系人，请确认每行末尾是至少 7 位电话号码';
    });

    $('clear').addEventListener('click', () => {
      $('source').value = '';
      contacts = [];
      render();
      $('download').disabled = true;
      $('status').className = 'status';
      $('status').textContent = '输入联系人后点击“解析联系人”';
      $('source').focus();
    });

    $('download').addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob(['\uFEFF', makeVcf()], { type: 'text/vcard;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = `contacts-${new Date().toISOString().slice(0, 10)}.vcf`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    ['prefix', 'suffix', 'phone-suffix'].forEach(id => $(id).addEventListener('input', render));

    console.assert(parseContacts('示例联系人甲 00000000000\n示例联系人乙 +00 000 000 000').found.length === 2, '联系人解析自检失败');
    console.assert(phoneLast4('+00 000 123 456') === '3456', '号码后四位自检失败');
  </script>
</body>
</html>
