<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
  <meta name="description" content="批量生成 WhatsApp 直达链接，支持 Excel 表格粘贴、国家区号和自定义编号，全程在浏览器本地处理。">
  <title>Everyday Tools</title>
  <link rel="stylesheet" href="styles.css?v=12">
  <link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('embedded');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body class="tool-page">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="layout">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html"><span class="logo"><img src="favicon.svg?v=3" width="34" height="34" alt=""></span>Everyday Tools</a>
        <nav class="site-nav" aria-label="主导航">
          <a class="nav-item" href="index.html">全部工具</a>
          <a class="nav-item" href="vcf.html">VCF 通讯录</a>
          <a class="nav-item active" href="whatsapp.html" aria-current="page">WhatsApp</a>
          <a class="nav-item" href="todo.html">待办清单</a>
          <a class="nav-item" href="worldtime.html">世界时间</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换浅色/深色模式" title="切换浅色/深色模式">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <header class="page-header">
        <h1>WhatsApp 链接</h1>
        <p class="intro">批量生成 wa.me 快捷直达链接，支持从 Excel 直接复制粘贴姓名与号码。</p>
      </header>
      <section class="card" aria-labelledby="table-heading">
        <div class="section-head">
          <h2 id="table-heading">联系人名单</h2>
          <span class="caption">从姓名列粘贴 Excel 的姓名、号码两列。</span>
        </div>
        <div class="options">
          <label>姓名前缀<input id="name-prefix" placeholder="例如：客户" autocomplete="off"></label>
          <label>默认国家区号<input id="phone-prefix" placeholder="例如：33 或 86" inputmode="tel" autocomplete="off"></label>
          <label>起始编号<input id="start-number" type="number" min="1" step="1" value="1"></label>
        </div>
        <div class="table" role="region" aria-label="联系人及 WhatsApp 链接，可横向滚动" tabindex="0">
          <div class="head"><span>生成结果</span><span>姓名</span><span>电话号码</span><span></span></div>
          <div id="rows"></div>
        </div>
        <div class="actions">
          <button id="copy" class="button primary" type="button" disabled>复制生成结果</button>
          <button id="add" class="button" type="button">＋ 添加一行</button>
          <button id="sample" class="button ghost" type="button">填入示例</button>
          <button id="clear" class="button" type="button">清空表格</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-links"><a href="index.html#privacy">隐私说明</a><a href="https://github.com/Alex97FR/alex97fr.github.io" target="_blank" rel="noopener noreferrer">开源代码 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H5v14h14v-3M13 5h6v6M19 5l-9 9"/></svg></a></div>
    </footer>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    let rows = [{ name: '', phone: '' }, { name: '', phone: '' }, { name: '', phone: '' }];
    const cleanNumber = value => value.replace(/\D/g, '');
    const setting = id => $(id).value.trim();
    const startNumber = () => {
      const value = Number(setting('start-number'));
      return Number.isSafeInteger(value) && value > 0 ? value : 1;
    };

    function linkFor(value) {
      const raw = value.trim();
      if (!raw || !/^\+?[\d\s().-]+$/.test(raw)) return '';
      const digits = cleanNumber(raw);
      const prefix = cleanNumber(setting('phone-prefix')).replace(/^00/, '');
      // shortcut: 裸号码优先视为已含默认区号；需要区分歧义本地号码时，应增加明确的输入格式选择。
      const phone = raw.startsWith('+') ? digits : raw.startsWith('00') ? digits.slice(2)
        : prefix && !digits.startsWith(prefix) ? prefix + digits : digits;
      return /^[1-9]\d{6,14}$/.test(phone) ? 'https://wa.me/' + phone : '';
    }

    function resultFor(contact, index, start) {
      const link = linkFor(contact.phone);
      return link ? (start + index) + '- ' + [setting('name-prefix'), contact.name.trim(), setting('phone-prefix'), link].filter(Boolean).join(' ') : '';
    }

    function splitContact(value) {
      const match = value.match(/(?:^|[\s,;:，；：])(\+?[\d(][\d\s().-]{5,}\d)\s*$/);
      return match ? { name: value.slice(0, match.index).replace(/[,;:，；：\s]+$/, '').trim(), phone: match[1].trim() } : null;
    }

    function pasteIntoRows(text, start, column) {
      const cells = text.replace(/(?:\r\n|\r|\n)+$/, '').split(/\r\n|\r|\n/).map(line => line.split('\t'));
      cells.forEach((cell, offset) => {
        const index = start + offset;
        while (rows.length <= index) rows.push({ name: '', phone: '' });
        if (cell.length > 1 && column === 'name') Object.assign(rows[index], { name: cell[0].trim(), phone: cell[1].trim() });
        else Object.assign(rows[index], (column === 'name' && splitContact(cell[0])) || { [column]: cell[0].trim() });
      });
      return cells.length;
    }

    function updateResults() {
      const start = startNumber();
      let valid = 0;
      document.querySelectorAll('#rows .link').forEach((link, index) => {
        const result = resultFor(rows[index], valid, start);
        if (result) valid++;
        link.textContent = result || (rows[index].phone.trim() ? '请检查号码及国家区号' : '等待填写号码');
        link.classList.toggle('pending', !result);
      });
      $('copy').disabled = valid === 0;
    }

    function render() {
      const box = $('rows');
      box.replaceChildren();
      rows.forEach((contact, index) => {
        const row = document.createElement('div');
        row.className = 'row';
        const link = document.createElement('span');
        link.className = 'link';
        const name = document.createElement('input');
        name.placeholder = '输入姓名';
        name.setAttribute('aria-label', '第 ' + (index + 1) + ' 行姓名');
        name.value = contact.name;
        const phone = document.createElement('input');
        phone.placeholder = '例如：+33 6 00 00 00 01';
        phone.type = 'tel';
        phone.setAttribute('aria-label', '第 ' + (index + 1) + ' 行电话号码');
        phone.value = contact.phone;
        const remove = document.createElement('button');
        remove.className = 'delete';
        remove.type = 'button';
        remove.textContent = '×';
        remove.setAttribute('aria-label', '删除第 ' + (index + 1) + ' 行');
        name.addEventListener('input', () => { contact.name = name.value; updateResults(); });
        phone.addEventListener('input', () => { contact.phone = phone.value; updateResults(); });
        [name, phone].forEach((input, columnIndex) => input.addEventListener('paste', event => {
          const text = event.clipboardData?.getData('text') || '';
          const column = columnIndex ? 'phone' : 'name';
          if (!/[\t\r\n]/.test(text) && !(column === 'name' && splitContact(text))) return;
          event.preventDefault();
          const count = pasteIntoRows(text, index, column);
          render();
          $('status').className = 'status';
          $('status').textContent = '已粘贴 ' + count + ' 行。';
          $('rows').children[index]?.querySelector(columnIndex ? 'input[type="tel"]' : 'input').focus();
        }));
        remove.addEventListener('click', () => {
          rows.splice(index, 1);
          if (!rows.length) rows.push({ name: '', phone: '' });
          render();
          $('rows').children[Math.min(index, rows.length - 1)].querySelector('input').focus();
        });
        row.append(link, name, phone, remove);
        box.append(row);
      });
      updateResults();
    }

    $('add').addEventListener('click', () => {
      rows.push({ name: '', phone: '' });
      render();
      $('rows').lastElementChild.querySelector('input').focus();
    });
    $('clear').addEventListener('click', () => {
      rows = [{ name: '', phone: '' }];
      render();
      $('status').className = 'status';
      $('status').textContent = '表格已清空。';
      $('rows').querySelector('input').focus();
    });
    ['name-prefix', 'phone-prefix', 'start-number'].forEach(id => $(id).addEventListener('input', updateResults));
    function showToast(message) {
      if (typeof document === 'undefined' || !document.body || typeof document.body.appendChild !== 'function') return;
      let box = document.getElementById('toast-container');
      if (!box) {
        box = document.createElement('div');
        box.id = 'toast-container';
        box.className = 'toast-container';
        box.setAttribute('aria-live', 'polite');
        document.body.appendChild(box);
      }
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      box.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove && toast.remove(), 250);
      }, 2200);
    }

    $('copy').addEventListener('click', async () => {
      const valid = rows.filter(contact => linkFor(contact.phone));
      if (!valid.length) return;
      const results = valid.map((contact, index) => resultFor(contact, index, startNumber())).join('\n');
      let copied = false;
      try { await navigator.clipboard.writeText(results); copied = true; }
      catch {
        const area = document.createElement('textarea');
        area.value = results;
        area.setAttribute('aria-label', '待复制的链接');
        document.body.append(area);
        area.select();
        try { copied = document.execCommand('copy'); } catch {}
        area.remove();
      }
      const skipped = rows.filter(contact => (contact.name.trim() || contact.phone.trim()) && !linkFor(contact.phone)).length;
      $('status').className = 'status' + (copied ? '' : ' error');
      $('status').textContent = copied
        ? '已复制 ' + valid.length + ' 条结果' + (skipped ? '，跳过 ' + skipped + ' 行无效号码' : '') + '。'
        : '浏览器未允许复制，请手动选中结果复制，或在 HTTPS 网站中重试。';
      if (copied) showToast(`已复制 ${valid.length} 条 WhatsApp 链接`);
    });

    $('sample').addEventListener('click', () => {
      $('name-prefix').value = 'VIP客户';
      $('phone-prefix').value = '33';
      $('start-number').value = '1';
      rows = [
        { name: 'Alexandre', phone: '+33 6 12 34 56 78' },
        { name: '王经理', phone: '+86 138 0000 0000' },
        { name: 'Sophie Martin', phone: '06 98 76 54 32' }
      ];
      render();
      $('status').className = 'status';
      $('status').textContent = '已填入 3 条示例联系人。';
      showToast('已填入示例数据');
    });

    const themeBtn = $('theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
          (!document.documentElement.getAttribute('data-theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch {}
        showToast(next === 'dark' ? '已切换至深色模式 🌙' : '已切换至浅色模式 ☀️');
      });
    }

    render();
  </script>
</body>
</html>
