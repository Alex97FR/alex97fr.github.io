<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
  <meta name="description" content="简单的本地待办清单，支持搜索、完成标记、编辑和排序，数据保存在当前浏览器。">
  <title>Everyday Tools</title>
  <link rel="stylesheet" href="styles.css?v=8">
  <link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('embedded');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body class="tool-page">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="layout">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html"><span class="logo"><img src="favicon.svg?v=3" width="34" height="34" alt=""></span>Everyday Tools</a>
        <nav class="site-nav" aria-label="主导航">
          <a class="nav-item" href="index.html">全部工具</a>
          <a class="nav-item" href="vcf.html">VCF 通讯录</a>
          <a class="nav-item" href="whatsapp.html">WhatsApp</a>
          <a class="nav-item active" href="todo.html" aria-current="page">待办清单</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换浅色/深色模式" title="切换浅色/深色模式">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <header class="page-header">
        <h1>待办清单</h1>
        <p class="intro">轻量本地任务清单，支持拖拽排序、搜索筛选及 JSON 备份恢复。</p>
      </header>
      <section class="card" aria-label="待办列表">
        <div class="add-row">
          <input id="new" aria-label="新待办事项" placeholder="输入待办，回车添加" autocomplete="off" maxlength="200">
          <button id="add" class="button primary" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加</button>
        </div>
        <div class="toolbar">
          <div class="tabs" role="group" aria-label="筛选">
            <button class="tab active" aria-pressed="true" data-f="all" type="button">全部 <span class="n" id="n-all">0</span></button>
            <button class="tab" aria-pressed="false" data-f="todo" type="button">进行中 <span class="n" id="n-todo">0</span></button>
            <button class="tab" aria-pressed="false" data-f="done" type="button">已完成 <span class="n" id="n-done">0</span></button>
          </div>
          <input id="search" class="search" aria-label="搜索待办事项" placeholder="搜索待办" autocomplete="off">
        </div>
        <p id="storage-status" class="status error" role="alert" hidden></p>
        <ul class="list" id="list"></ul>
        <div class="empty" id="empty" hidden>暂无待办</div>
        <div class="foot">
          <span id="summary" role="status" aria-live="polite">已完成 0 / 0</span>
          <div class="foot-actions">
            <button id="export" class="button ghost" type="button" title="导出待办数据备份">导出备份</button>
            <label class="button ghost import-label" title="导入待办 JSON 数据">导入备份<input id="import" type="file" accept=".json,application/json" hidden></label>
            <button id="clear" class="button ghost" type="button">清除已完成</button>
          </div>
        </div>
      </section>
      <p class="hint">仅保存在当前浏览器，清理网站数据会删除待办。</p>

    </main>
    <footer class="site-footer">
      <div class="footer-links"><a href="index.html#privacy">隐私说明</a><a href="https://github.com/Alex97FR/alex97fr.github.io" target="_blank" rel="noopener noreferrer">开源代码 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H5v14h14v-3M13 5h6v6M19 5l-9 9"/></svg></a></div>
    </footer>
  </div>
  <script>
    const KEY = 'wctools.todo.v1';
    const $ = id => document.getElementById(id);
    let items = [];
    let filter = 'all';
    let dragId = null;

    let storageBlocked = false;
    try {
      items = JSON.parse(localStorage.getItem(KEY) || '[]');
      if (!Array.isArray(items) || !items.every(item => item && typeof item.id === 'string' && typeof item.text === 'string' && typeof item.done === 'boolean')) throw new Error('Invalid todo data');
    } catch {
      items = [];
      storageBlocked = true;
      $('storage-status').hidden = false;
      $('storage-status').textContent = '无法读取本地待办。为避免覆盖原数据，已暂停修改；请先备份浏览器数据并检查存储权限。';
      $('new').disabled = true;
      $('add').disabled = true;
    }

    const save = () => {
      if (storageBlocked) return;
      try { localStorage.setItem(KEY, JSON.stringify(items)); $('storage-status').hidden = true; }
      catch {
        $('storage-status').hidden = false;
        $('storage-status').textContent = '本次修改未能保存到浏览器，刷新后可能丢失。请先复制重要事项，并检查存储空间或权限。';
      }
    };

    function counts() {
      const done = items.filter(i => i.done).length;
      $('n-all').textContent = items.length;
      $('n-todo').textContent = items.length - done;
      $('n-done').textContent = done;
      $('clear').disabled = done === 0;
      $('summary').textContent = `已完成 ${done} / ${items.length}`;
    }

    function visible() {
      const q = $('search').value.trim().toLowerCase();
      return items.filter(i => {
        const matchTab = filter === 'all' || (filter === 'done') === !!i.done;
        const matchQ = !q || (i.text || '').toLowerCase().includes(q);
        return matchTab && matchQ;
      });
    }

    function render() {
      counts();
      const box = $('list');
      box.replaceChildren();
      const shown = visible();
      $('empty').hidden = shown.length > 0;
      $('empty').textContent = items.length ? '没有匹配的事项' : '暂无待办';
      shown.forEach(item => {
        const li = document.createElement('li');
        li.className = 'item' + (item.done ? ' done' : '');
        li.dataset.id = item.id;


        const grip = document.createElement('button');
        grip.type = 'button';
        grip.draggable = true;
        grip.className = 'drag';
        grip.title = '拖拽排序，或按上下方向键移动';
        grip.setAttribute('aria-label', '排序：' + item.text + '，使用上下方向键移动');
        grip.addEventListener('keydown', e => {
          if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
          e.preventDefault();
          const target = items[items.indexOf(item) + (e.key === 'ArrowUp' ? -1 : 1)];
          if (!target) return;
          dragId = item.id;
          reorder(target.id);
          dragId = null;
          [...$('list').children].find(row => row.dataset.id === item.id)?.querySelector('.drag').focus();
        });
        grip.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="9" cy="5" r="1.6"/><circle cx="15" cy="5" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="19" r="1.6"/><circle cx="15" cy="19" r="1.6"/></svg>';

        const check = document.createElement('button');
        check.className = 'check';
        check.type = 'button';
        check.title = item.done ? '标为未完成' : '标为已完成';
        check.setAttribute('aria-label', check.title);
        check.innerHTML = '<svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg>';
        check.addEventListener('click', () => { item.done = !item.done; save(); render(); });

        const txt = document.createElement('span');
        txt.className = 'txt';
        txt.textContent = item.text;
        txt.title = '双击编辑：' + item.text;
        txt.addEventListener('dblclick', () => beginEdit(item, li));

        const del = document.createElement('button');
        del.className = 'del';
        del.type = 'button';
        del.title = '删除';
        del.setAttribute('aria-label', '删除');
        del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m3 0-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg>';
        del.addEventListener('click', () => { items = items.filter(x => x.id !== item.id); save(); render(); });

        const edit = document.createElement('button');
        edit.className = 'del';
        edit.type = 'button';
        edit.setAttribute('aria-label', '编辑：' + item.text);
        edit.title = '编辑';
        edit.innerHTML = '<svg viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14Z"/></svg>';
        edit.addEventListener('click', () => beginEdit(item, li));
        li.append(grip, check, txt, edit, del);

        li.addEventListener('dragstart', e => {
          if (!e.target.closest('.drag')) { e.preventDefault(); return; }
          dragId = item.id;
          li.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', item.id);
        });
        li.addEventListener('dragover', e => {
          if (!dragId) return;
          e.preventDefault();
          li.classList.add('over');
        });
        li.addEventListener('dragleave', () => li.classList.remove('over'));
        li.addEventListener('drop', e => {
          e.preventDefault();
          li.classList.remove('over');
          if (dragId && dragId !== item.id) reorder(item.id);
        });
        li.addEventListener('dragend', () => {
          dragId = null;
          document.querySelectorAll('.item').forEach(x => x.classList.remove('dragging', 'over'));
        });

        box.append(li);
      });
    }

    function reorder(targetId) {
      const from = items.findIndex(i => i.id === dragId);
      const to = items.findIndex(i => i.id === targetId);
      if (from < 0 || to < 0 || from === to) return;
      const [moved] = items.splice(from, 1);
      const to2 = items.findIndex(i => i.id === targetId);
      items.splice(to2 + (from < to ? 1 : 0), 0, moved);
      save();
      render();
    }

    function beginEdit(item, li) {
      if (li.classList.contains('editing')) return;
      li.classList.add('editing');
      const input = document.createElement('input');
      input.className = 'edit-input';
      input.setAttribute('aria-label', '编辑待办事项');
      input.value = item.text;
      input.maxLength = 200;
      const txt = li.querySelector('.txt');
      txt.replaceWith(input);
      input.focus();
      input.select();
      let done = false;
      const commit = keep => {
        if (done) return;
        done = true;
        const val = input.value.trim();
        if (keep && val) item.text = val;
        save();
        render();
      };
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.isComposing) commit(true);
        else if (e.key === 'Escape') commit(false);
      });
      input.addEventListener('blur', () => commit(true));
    }

    function add() {
      if (storageBlocked) return;
      const text = $('new').value.trim();
      if (!text) return;
      items.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), text, done: false });
      $('new').value = '';
      save();
      render();
      $('new').focus();
    }

    function showToast(message) {
      if (typeof document === 'undefined' || !document.body || typeof document.body.appendChild !== 'function') return;
      let box = document.getElementById('toast-container');
      if (!box) {
        box = document.createElement('div');
        box.id = 'toast-container';
        box.className = 'toast-container';
        box.setAttribute('aria-live', 'polite');
        document.body.appendChild(box);
      }
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      box.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove && toast.remove(), 250);
      }, 2200);
    }

    $('add').addEventListener('click', add);
    $('new').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) add(); });
    $('search').addEventListener('input', render);
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      filter = t.dataset.f;
      document.querySelectorAll('.tab').forEach(x => { x.classList.toggle('active', x === t); x.setAttribute('aria-pressed', String(x === t)); });
      render();
    }));
    $('clear').addEventListener('click', () => {
      const doneCount = items.filter(i => i.done).length;
      if (!doneCount) return;
      items = items.filter(i => !i.done);
      save();
      render();
      showToast(`已清除 ${doneCount} 项已完成事项`);
    });

    $('export').addEventListener('click', () => {
      if (!items.length) {
        showToast('当前暂无待办事项可导出');
        return;
      }
      const data = JSON.stringify(items, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `todos-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast(`已导出 ${items.length} 条待办备份`);
    });

    $('import').addEventListener('change', event => {
      if (storageBlocked) {
        showToast('本地存储受限，无法导入');
        return;
      }
      const file = event.target?.files?.[0];
      if (!file || typeof FileReader === 'undefined') return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error('Format error');
          const valid = imported.filter(item => item && typeof item.text === 'string');
          if (!valid.length) throw new Error('Empty');
          let added = 0;
          const existingIds = new Set(items.map(i => i.id));
          valid.forEach(v => {
            const id = (v.id && !existingIds.has(v.id)) ? v.id : Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            items.push({ id, text: v.text.trim(), done: !!v.done });
            existingIds.add(id);
            added++;
          });
          save();
          render();
          showToast(`已成功导入 ${added} 条事项`);
        } catch {
          showToast('导入失败：文件格式不符合待办 JSON 规范');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    });

    const themeBtn = $('theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
          (!document.documentElement.getAttribute('data-theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch {}
        showToast(next === 'dark' ? '已切换至深色模式 🌙' : '已切换至浅色模式 ☀️');
      });
    }

    render();
  </script>
</body>
</html>
